<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smelt Next — In-Browser 3DS ROM Forge</title>
  <meta name="description" content="Client-side Nintendo 3DS ROM decryptor. 100% private, zero uploads.">
  <meta name="theme-color" content="#222222">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles/main.css?v=8">
</head>
<body>
  <!-- Global Skeuomorphic Background is handled in CSS -->
  
  <div class="ds-chassis">
    <!-- TOP SCREEN SECTION (16:9, Black Bezel, Display Only) -->
    <div class="top-screen-bezel">
      <div class="status-bar-left">
        <span class="wifi-icon" title="Wi-Fi">📶</span>
        <span class="pedometer-icon" title="Steps (MBs Forged)">🐾 <span id="hud-steps">0</span></span>
      </div>
      
      <div class="status-bar-right">
        <span class="battery-icon" title="Battery">🔋</span>
      </div>
      
      <div class="top-screen">
        <div class="scanlines"></div>
        <div class="top-screen-content">
          <!-- Banner -->
          <div class="banner-container">
            <h1 class="hero-title">
              <span class="brand-logo">✨</span> Smelt <span class="brand-tag">NEXT</span>
            </h1>
            <p class="hero-subtitle">High-speed hardware decryption.</p>
          </div>
          
          <!-- 3D Cartridge Animation Area -->
          <div class="cartridge-animation-container">
            <div class="cartridge-cube" id="cartridge-spinner">
              <div class="face front">SMELT</div>
              <div class="face back">ROM</div>
              <div class="face right"></div>
              <div class="face left"></div>
              <div class="face top"></div>
              <div class="face bottom"></div>
            </div>
          </div>

          <!-- Global Stats HUD -->
          <div class="global-stats-hud">
            <div class="hud-item">
              <span class="hud-label">Throughput</span>
              <span id="hud-speed" class="hud-value">0.0 MB/s</span>
            </div>
            <div class="hud-item">
              <span class="hud-label">ETA</span>
              <span id="hud-eta" class="hud-value">Ready</span>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 3D Depth Slider on the Right Bezel -->
      <div class="slider-3d-container">
        <div class="slider-label">3D</div>
        <div class="slider-track">
          <div class="slider-thumb" id="slider-3d"></div>
        </div>
        <div class="slider-label off">OFF</div>
      </div>
    </div>

    <!-- HINGE SECTION -->
    <div class="chassis-hinge">
      <div class="hinge-light orange" title="Friend/SpotPass"></div>
      
      <div class="camera-cutouts">
        <div class="camera-lens"></div>
        <div class="camera-lens"></div>
      </div>
      
      <div class="hinge-light green" title="StreetPass"></div>
    </div>

    <!-- BOTTOM SCREEN SECTION (4:3, Light Bezel, Interactive) -->
    <div class="bottom-screen-bezel">
      <div class="bottom-screen">
        <div class="scanlines-light"></div>
        <div class="bottom-screen-content">
          
          <!-- Drag & Drop Cartridge Slot -->
          <section id="dropzone" class="dropzone-area">
            <div class="dropzone-content">
              <span class="forge-anvil-icon">📥</span>
              <h2 class="dropzone-headline">Insert ROM Cartridges Here</h2>
              <p class="dropzone-desc">Supports .3ds, .cci, .cia, .cxi</p>
              <label for="file-input" class="btn-frutiger">
                <span class="btn-inner">Browse Files</span>
                <input type="file" id="file-input" multiple hidden>
              </label>
            </div>
          </section>

          <!-- Interactive Workspace: Queue & Terminal -->
          <section class="forge-workspace">
            <!-- Queue Panel -->
            <div class="panel-card queue-panel">
              <div class="panel-header">
                <h3 class="panel-title">📦 Queue</h3>
                <select id="select-format" class="select-glossy">
                  <option value="same" selected>Default</option>
                  <option value="cci">.CCI</option>
                  <option value="3ds">.3DS</option>
                </select>
              </div>

              <div id="queue-list" class="queue-container">
                <div id="empty-queue" class="queue-empty-state">
                  <p>Queue Empty</p>
                </div>
              </div>

              <div class="panel-footer">
                <label class="checkbox-frutiger">
                  <input type="checkbox" id="check-auto-download" checked>
                  <span>Auto-save</span>
                </label>
                <div class="footer-actions">
                  <button id="btn-clear-all" class="btn-frutiger small">Clear</button>
                  <button id="btn-forge-all" class="btn-frutiger primary small" disabled>Forge All</button>
                </div>
              </div>
            </div>

            <!-- Terminal Panel -->
            <div class="panel-card console-panel">
              <div class="panel-header">
                <h3 class="panel-title">📟 Terminal</h3>
                <div class="panel-actions">
                  <button id="btn-clear-console" class="btn-frutiger icon-btn" title="Clear">🧹</button>
                  <button id="btn-export-console" class="btn-frutiger icon-btn" title="Save Log">💾</button>
                </div>
              </div>
              <div id="console-output" class="console-terminal"></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- ROM Inspector Modal -->
  <div id="inspector-modal" class="modal-overlay hidden">
    <div class="modal-dialog frutiger-modal">
      <button class="modal-close btn-frutiger icon-btn">✕</button>
      <div class="inspector-content"></div>
    </div>
  </div>

  <script type="module" src="src/ui/app.js?v=8"></script>
</body>
</html>
