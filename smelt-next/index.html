<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smelt Next — Nintendo 3DS ROM Decryptor</title>
  <meta name="description" content="High-performance, client-side Nintendo 3DS ROM decryptor. 100% private, zero uploads.">
  <meta name="theme-color" content="#3a3d44">
  <link rel="manifest" href="manifest.json?v=20260821_19">
  <link rel="stylesheet" href="styles/main.css?v=20260821_19">
</head>
  <!-- Modern Animated Background -->
  <div class="glass-bg-animation" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <div class="app-layout">
    <!-- Top System App Bar -->
    <header class="app-top-bar glass-panel">
      <div class="brand">
        <span class="brand-logo">SMELT</span>
        <span class="brand-suffix">NEXT</span>
      </div>
      
      <div class="system-metrics">
        <div class="metric-chip"><span class="label">SPD</span><span id="hud-speed" class="val">0.0 MB/s</span></div>
        <div class="metric-chip"><span class="label">ETA</span><span id="hud-eta" class="val">Ready</span></div>
        <div class="metric-chip"><span class="label">CPU</span><span id="hud-threads" class="val">—</span></div>
      </div>
      
      <div class="system-status">
        <div class="metric-chip"><span class="label">OUT</span><span id="hud-steps" class="val">0 MB</span></div>
        <span class="sys-clock" id="sys-clock">--:--</span>
      </div>
    </header>

    <main class="app-content">
      <!-- Sidebar: Queue & Dropzone -->
      <aside class="sidebar glass-panel">
        
        <!-- View: Dropzone -->
        <div id="view-dropzone" class="view-layer active">
          <section id="dropzone" class="dropzone-area material-dropzone">
            <div class="dropzone-inner">
              <div class="upload-icon-wrapper">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
              </div>
              <h2 class="dropzone-title">Upload ROMs</h2>
              <p class="dropzone-subtitle">Drop <span class="mono">.3DS, .CCI, .CIA, .CXI</span> here</p>
              <label for="file-input" class="btn-material primary-btn">
                Select Files
                <input type="file" id="file-input" multiple hidden>
              </label>
              <div class="privacy-badge">Client-Side WebCrypto · 100% Private</div>
            </div>
            <!-- Hidden cartridge animation container for JS compatibility -->
            <div id="cartridge-anim" style="display:none;"></div>
          </section>
        </div>

        <!-- View: Active Queue -->
        <div id="view-queue" class="view-layer">
          <div class="queue-header">
            <h2 class="section-title">Queue</h2>
            <div class="queue-actions">
              <label for="queue-file-input" class="icon-btn" title="Add ROMs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                <input type="file" id="queue-file-input" multiple hidden>
              </label>
              <button id="btn-eject-top" class="icon-btn" title="Close Queue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>
          
          <div class="queue-options">
            <select id="select-format" class="material-select">
              <option value="same" selected>Keep original</option>
              <option value="3ds">.3DS</option>
              <option value="cci">.CCI</option>
            </select>
            <label class="material-checkbox">
              <input type="checkbox" id="check-auto-download" checked>
              <span>Auto-save</span>
            </label>
          </div>

          <div id="empty-queue" class="empty-state">No ROMs queued.</div>
          <div id="queue-list" class="queue-list" role="list"></div>
          
          <div class="queue-footer">
            <button id="btn-forge-all" class="btn-material forge-btn" disabled>Forge All</button>
          </div>
        </div>
      </aside>

      <!-- Main Area: Console -->
      <section class="console-section glass-panel">
        <div class="console-header">
          <h2 class="section-title">Console Output</h2>
          <div class="console-actions">
            <button id="btn-touch-clear-log" class="text-btn">Clear</button>
            <button id="btn-touch-export-log" class="text-btn">Export</button>
          </div>
        </div>
        <div class="console-wrapper">
          <div id="console-output" class="console-terminal material-terminal" role="log" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- ROM Inspector Modal -->
  <div id="inspector-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-dialog material-modal glass-panel">
      <button class="modal-close material-close" aria-label="Close Inspector">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="inspector-content"></div>
    </div>
  </div>

  <div class="sr-only" aria-hidden="true">
    <button id="btn-clear-all" type="button"></button>
    <button id="btn-clear-console" type="button"></button>
    <button id="btn-export-console" type="button"></button>
  </div>

  <script type="module" src="src/ui/app.js?v=20260821_19"></script>
</body>
</html>
